[package]
name = "virtualdj-connect-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VirtualDJ M3U history and Network Control metadata client"
repository = "https://github.com/chrisle/virtualdj-connect-rs"
readme = "README.md"
[workspace]
[dependencies]
serde = {version="1",features=["derive"]}
serde_json = "1"
md5 = "0.7"
chrono = {version="0.4",features=["serde"]}
regex = "1"
reqwest = {version="0.12",default-features=false,features=["blocking","rustls-tls"]}
